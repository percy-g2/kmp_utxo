kotlin.code.style=official

#Gradle
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx6g"

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#Kotlin Multiplatform
kotlin.mpp.enableCInteropCommonization=true
kotlin.native.binary.smallBinary=true

#App version — single source of truth for Android/Web/Desktop.
#Bumped by CI (scripts/bump-version.sh) from the release tag; the iOS pbxproj is kept in lockstep.
app.versionName=0.4.17
app.versionCode=417

# Where the web (wasmJs) build reads its RSS feeds from. Browsers cannot fetch the publishers'
# feeds directly -- none of them send Access-Control-Allow-Origin -- so .github/workflows/mirror-rss.yml
# mirrors them into the published site and the browser reads them same-origin from here.
# Point this at your own Pages site if you fork the repo.
web.rssMirrorBase=https://percy-g2.github.io/kmp_utxo/rss
